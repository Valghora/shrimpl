org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

android.enableResourceOptimizations=false

# Versions, as major.minor (docs/SHRIMPL_SPEC.md R11.8): each merged change to an APK raises its
# minor version by one (1.0, 1.1, ... 1.99); only the owner starts a new major version.
# Shrimpl's own version.
shrimpl.appVersion=1.1
# The web app template's version: Shrimpl offers an Update to apps built with an older one (R11.4).
shrimpl.templateVersion=1.0
