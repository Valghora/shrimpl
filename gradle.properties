org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

android.enableResourceOptimizations=false

# Versions, as major.minor.patch (docs/SHRIMPL_SPEC.md R11.8): each merged change to an APK raises
# its last part by one, carrying at 9 (1.1.9, then 1.2.0); only the owner starts a new major version.
# Shrimpl's own version.
shrimpl.appVersion=1.1.6
# The web app template's version: Shrimpl offers an Update to apps built with an older one (R11.4).
shrimpl.templateVersion=1.0.4
