org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

android.enableResourceOptimizations=false

# The web app template's version (docs/UNIWRAP_SPEC.md R11.4): bump whenever template code or
# resources change, so UniWrap offers updates for web apps built with an older template.
uniwrap.templateVersion=3
