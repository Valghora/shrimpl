name: Release

# R12.6: a push to main (a merge from develop) publishes Shrimpl's release APK, signed with the release
# key, as the release v<version> that Shrimpl's update check reads (R14.1). The workflow creates the
# tag itself, so nobody pushes one. It can also be run by hand on main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      # shrimpl.appVersion names the release. A version already released (a merge to main that
      # changed only documentation) publishes nothing; a tag of it without a release is a mistake.
      - name: Version to publish
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::releases come only from main"
            exit 1
          fi
          version=$(sed -n 's/^shrimpl.appVersion=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Shrimpl $version is already released; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::tag v$version exists without a release"
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history and tags: the notes list what merged since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api37-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      # The key lives only in the runner's temporary directory, for this job, and is deleted after it.
      - name: Release key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE" ]]; then
            echo "::error::the RELEASE_KEYSTORE secret is missing"
            exit 1
          fi
          base64 -d <<<"$RELEASE_KEYSTORE" > "$RUNNER_TEMP/release.jks"

      - name: Shrimpl release APK
        env:
          SHRIMPL_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          SHRIMPL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SHRIMPL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SHRIMPL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --console=plain :shrimpl:assembleRelease

      # A release signed with the debug key could never update an installed release, so the job stops.
      - name: Signed with the release key
        run: |
          apk=shrimpl/build/outputs/apk/release/shrimpl-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep "certificate DN"
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::the release APK is signed with the debug key"
            exit 1
          fi

      # R0 and 16 KB page alignment, as in the Android workflow.
      - name: Architecture-neutral APK
        run: |
          scripts/check_native_code.sh --all-abis shrimpl/build/outputs/apk/release/shrimpl-release.apk
          scripts/check_page_alignment.sh shrimpl/build/outputs/apk/release/shrimpl-release.apk

      # The names Shrimpl's update check looks for (R14.1): shrimpl-<version>.apk and its .sha256.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          apk="shrimpl-$VERSION.apk"
          cp shrimpl/build/outputs/apk/release/shrimpl-release.apk "$RUNNER_TEMP/out/$apk"
          (cd "$RUNNER_TEMP/out" && sha256sum "$apk" > "$apk.sha256")
          scripts/release_notes.sh > "$RUNNER_TEMP/notes.md"
          # Creates the tag v<version> on this commit too. The notes are Shrimpl's own (R12.6), not
          # GitHub's generated ones, which mention people and list new contributors.
          gh release create "v$VERSION" "$RUNNER_TEMP/out/$apk" "$RUNNER_TEMP/out/$apk.sha256" \
            --target "$GITHUB_SHA" --title "Shrimpl $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
