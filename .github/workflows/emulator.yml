name: Emulator

# Instrumented tests on a real Android system (docs/SHRIMPL_SPEC.md R12.4, docs/TESTING.md, "The emulator's environment"): the template's WebView
# and its bridges, and Shrimpl building, installing and launching a web app. GitHub's Linux runners
# expose KVM, so the x86_64 emulator runs at hardware speed; the cloud container Claude Code works in
# has no KVM and can't run one.
#
# By hand only (workflow_dispatch), on a branch that is ready to merge: it is the slowest check, so it
# doesn't run on every push. Main only fast-forwards to a commit it passed on.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk
  EMULATOR_DIR: ${{ github.workspace }}/emulator-out

jobs:
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # The runner's disk is small next to an emulator's data partition; drop software this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/share/swift
          df -h / | tail -1

      # Not cached: restoring the SDK and system image from the Actions cache took 136 s, downloading takes about 70.
      - name: Set up Android SDK
        run: scripts/setup_android_sdk.sh

      # The runner has 7 GB and the emulator takes 4: building with it running killed the runner (2026-11-08,
      # "AAPT2 daemon unexpectedly exit", then a shutdown signal). So everything is built first and the
      # Gradle daemons stopped before the emulator starts; the test step then only installs and runs. The app
      # APKs are built here too: the connected-test tasks would otherwise build them with the emulator running.
      - name: Build the APKs and test APKs
        run: >-
          ./gradlew --console=plain :template:assembleDebug :shrimpl:assembleDebug
          :template:assembleDebugAndroidTest :shrimpl:assembleDebugAndroidTest
          -x :template:lintVitalRelease

      - name: Free memory for the emulator
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          free -m | head -2

      - name: Start the emulator
        run: scripts/start_emulator.sh

      # One Gradle run for both modules, which continues past a failure so a run shows every failure at once;
      # a module that reports no tests at all is retried alone and then fails the job.
      - name: Instrumented tests
        run: scripts/run_instrumented_tests.sh

      - name: Collect emulator evidence
        if: always()
        run: scripts/collect_emulator_artifacts.sh

      - name: Upload test results and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results
          path: |
            emulator-out/
            template/build/reports/androidTests/
            template/build/outputs/androidTest-results/
            shrimpl/build/reports/androidTests/
            shrimpl/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 1
