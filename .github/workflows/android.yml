name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  build:
    name: Core, template and UniWrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api37-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      # :core:check runs the core tests (including building real web apps from the template release
      # APK) and the 85% line-coverage rule.
      - name: Tests, lint and builds
        run: >-
          ./gradlew --console=plain :core:check :core:jacocoTestReport
          :template:testDebugUnitTest :template:lintRelease :template:assembleRelease
          :uniwrap:testDebugUnitTest :uniwrap:lintDebug :uniwrap:assembleDebug :uniwrap:assembleRelease

      - name: Template has no native code
        run: |
          apk=template/build/outputs/apk/release/template-release.apk
          if unzip -l "$apk" | grep -qE '(^|/)lib/|\.so$'; then echo "::error::native code in $apk"; exit 1; fi

      - name: Upload template and UniWrap APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            template/build/outputs/apk/release/template-release.apk
            uniwrap/build/outputs/apk/debug/uniwrap-debug.apk
            uniwrap/build/outputs/apk/release/uniwrap-release.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            core/build/test-results/
            template/build/reports/
            template/build/test-results/
            uniwrap/build/reports/
          if-no-files-found: ignore
