name: Android

on:
  # R12.2: a branch passes here before it merges into develop, so the merge isn't built again.
  push:
    branches-ignore:
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release build (Shrimpl's release APK and its R0 check)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  checks:
    name: Checks
    # Pull requests from this repository's own branches are already covered by their push; a pull
    # request runs this workflow only from a fork, whose branches never reach this repository's push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7

      # A merge commit has its own ID but often the very files of a commit that already passed (a branch
      # merged into develop that hadn't moved); building it again would repeat the same work, so Build
      # is skipped when a commit with the same tree passed Build here. A manual run always builds.
      - name: Already verified?
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=false
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            tree=$(git rev-parse HEAD^{tree})
            # Recent passing runs of this workflow, as "run-id head-sha" (the Actions API, which the
            # job's token can read; check runs need a permission it doesn't have).
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=50" \
              --jq '.workflow_runs[] | select(.name == "${{ github.workflow }}" and .id != ${{ github.run_id }}) | "\(.id) \(.head_sha)"')
            while read -r run sha; do
              [[ -n "$run" ]] || continue
              [[ "$(gh api "repos/${{ github.repository }}/git/commits/$sha" --jq .tree.sha 2>/dev/null)" == "$tree" ]] || continue
              # A passing run whose Build was skipped (documentation only, or itself verified) proves nothing.
              built=$(gh api "repos/${{ github.repository }}/actions/runs/$run/jobs" \
                --jq '[.jobs[] | select(.name == "Build" and .conclusion == "success")] | length' 2>/dev/null) || built=0
              if [[ "$built" =~ ^[0-9]+$ && "$built" -gt 0 ]]; then
                echo "::notice::${sha::7} has the same files and passed Build in run $run; skipping Build"
                verified=true
                break
              fi
            done <<<"$runs"
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      # R12.2: a change to documentation only (docs/ and Markdown) needs only these checks, not Build.
      # Compared with the pushed range, the pull request's base, or develop for a new branch; a manual
      # run always builds.
      - name: Documentation only?
        id: docs
        run: |
          before="${{ github.event.before }}"
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) if [[ -n "$before" && "$before" != 0000000000000000000000000000000000000000 ]]; then base="$before"; else base=develop; fi ;;
            *) base="" ;;
          esac
          docs_only=false
          if [[ -n "$base" ]] && git fetch -q --depth=1 origin "$base"; then
            changed=$(git diff --name-only FETCH_HEAD HEAD)
            if [[ -n "$changed" ]] && ! grep -qvE '^docs/|\.md$' <<<"$changed"; then
              docs_only=true
              echo "::notice::only documentation changed; skipping Build"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      # The branch this one's new lines are measured against (R12.5): develop for work branched from it,
      # main for develop itself, none on main.
      - name: Branch to compare against
        id: base
        run: |
          case "${{ github.ref_name }}" in
            main) base="" ;;
            develop) base=main ;;
            *) base=develop ;;
          esac
          if [[ -n "$base" ]]; then
            git fetch -q --depth=1 origin "$base"
            echo "diff=--diff origin/$base" >> "$GITHUB_OUTPUT"
          fi

      # Comments: requirement IDs and doc paths resolve, TODOs are tracked, every requirement is traced
      # (code-comments skill); new comment lines are also checked for narration (history belongs in
      # commit messages).
      - name: Comment references
        run: scripts/check_comments.sh ${{ steps.base.outputs.diff }}

      # Documents: requirement IDs and paths resolve; UI text the specs quote has a string resource.
      - name: Document references
        run: scripts/check_docs.py ${{ steps.base.outputs.diff }}

  build:
    name: Build
    needs: checks
    if: needs.checks.outputs.verified != 'true' && needs.checks.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api37-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      # Lint vital, which each release build runs, is a subset of the full release lint run below on
      # the same variant, so these steps skip it rather than lint the same code twice.

      # The core tests build real web apps from the template release APK; check includes the 95 %
      # line-coverage rule.
      - name: Core
        run: ./gradlew --console=plain :core:check :core:jacocoTestReport -x :template:lintVitalRelease

      - name: Template
        run: >-
          ./gradlew --console=plain :template:testDebugUnitTest :template:lintRelease :template:assembleRelease
          -x :template:lintVitalRelease

      - name: Shrimpl tests
        run: ./gradlew --console=plain :shrimpl:testDebugUnitTest -x :template:lintVitalRelease

      # Release lint covers all of Shrimpl's code: it has no debug-only sources (test tags switch off
      # at run time, R13).
      - name: Shrimpl lint
        run: ./gradlew --console=plain :shrimpl:lintRelease -x :template:lintVitalRelease

      # Shrimpl is tested as a debug build; its release APK is built only when a manual run asks for
      # it (R12.2). The template's release APK is always built: Shrimpl bundles it in every build.
      - name: Shrimpl APK
        run: ./gradlew --console=plain :shrimpl:assembleDebug -x :template:lintVitalRelease

      - name: Shrimpl release APK
        if: inputs.release
        run: ./gradlew --console=plain :shrimpl:assembleRelease -x :template:lintVitalRelease -x :shrimpl:lintVitalRelease

      # R0: no APK may need a translation layer on ARM or x86 devices. The template (and so every web
      # app built from it) has no native code; Shrimpl's third-party libraries must cover all four ABIs.
      - name: Architecture-neutral APKs
        run: |
          scripts/check_native_code.sh --none template/build/outputs/apk/release/template-release.apk
          scripts/check_native_code.sh --all-abis shrimpl/build/outputs/apk/debug/shrimpl-debug.apk
          if [[ -f shrimpl/build/outputs/apk/release/shrimpl-release.apk ]]; then
            scripts/check_native_code.sh --all-abis shrimpl/build/outputs/apk/release/shrimpl-release.apk
          fi
          # Android 15+ devices may use 16 KB memory pages; a library that isn't aligned for them can't load.
          scripts/check_page_alignment.sh template/build/outputs/apk/release/template-release.apk shrimpl/build/outputs/apk/debug/shrimpl-debug.apk
          if [[ -f shrimpl/build/outputs/apk/release/shrimpl-release.apk ]]; then
            scripts/check_page_alignment.sh shrimpl/build/outputs/apk/release/shrimpl-release.apk
          fi

      # Test and lint reports, to read what failed.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            core/build/test-results/
            template/build/reports/
            template/build/test-results/
            shrimpl/build/reports/
          if-no-files-found: ignore
          retention-days: 1
