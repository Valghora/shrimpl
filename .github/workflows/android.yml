name: Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release build (Shrimpl's release APK and its R0 check)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@v7

      # Merging fast-forwards main to a commit that already passed on its branch; building it again
      # would repeat the same work, so Build is skipped for a commit this workflow already passed.
      - name: Already verified?
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "${{ github.workflow }}" and .id != ${{ github.run_id }})] | length')
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$passed" -gt 0 ]]; then
            echo "::notice::${{ github.sha }} already passed this workflow; skipping Build"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      # Comments: requirement IDs and doc paths resolve, TODOs are tracked (code-comments skill).
      - name: Comment references
        run: scripts/check_comments.sh

  build:
    name: Build
    needs: checks
    if: needs.checks.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api37-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      # Lint vital, which each release build runs, is a subset of the full release lint run below on
      # the same variant, so these steps skip it rather than lint the same code twice.

      # The core tests build real web apps from the template release APK; check includes the 95 %
      # line-coverage rule.
      - name: Core
        run: ./gradlew --console=plain :core:check :core:jacocoTestReport -x :template:lintVitalRelease

      - name: Template
        run: >-
          ./gradlew --console=plain :template:testDebugUnitTest :template:lintRelease :template:assembleRelease
          -x :template:lintVitalRelease

      - name: Shrimpl tests
        run: ./gradlew --console=plain :shrimpl:testDebugUnitTest -x :template:lintVitalRelease

      # Release lint covers all of Shrimpl's code: it has no debug-only sources (test tags switch off
      # at run time, R13).
      - name: Shrimpl lint
        run: ./gradlew --console=plain :shrimpl:lintRelease -x :template:lintVitalRelease

      # Shrimpl is tested as a debug build; its release APK is built only when a manual run asks for
      # it (R12.2). The template's release APK is always built: Shrimpl bundles it in every build.
      - name: Shrimpl APK
        run: ./gradlew --console=plain :shrimpl:assembleDebug -x :template:lintVitalRelease

      - name: Shrimpl release APK
        if: inputs.release
        run: ./gradlew --console=plain :shrimpl:assembleRelease -x :template:lintVitalRelease -x :shrimpl:lintVitalRelease

      # R0: no APK may need a translation layer on ARM or x86 devices. The template (and so every web
      # app built from it) has no native code; Shrimpl's third-party libraries must cover all four ABIs.
      - name: Architecture-neutral APKs
        run: |
          scripts/check_native_code.sh --none template/build/outputs/apk/release/template-release.apk
          scripts/check_native_code.sh --all-abis shrimpl/build/outputs/apk/debug/shrimpl-debug.apk
          if [[ -f shrimpl/build/outputs/apk/release/shrimpl-release.apk ]]; then
            scripts/check_native_code.sh --all-abis shrimpl/build/outputs/apk/release/shrimpl-release.apk
          fi
          # Android 15+ devices may use 16 KB memory pages; a library that isn't aligned for them can't load.
          scripts/check_page_alignment.sh template/build/outputs/apk/release/template-release.apk shrimpl/build/outputs/apk/debug/shrimpl-debug.apk
          if [[ -f shrimpl/build/outputs/apk/release/shrimpl-release.apk ]]; then
            scripts/check_page_alignment.sh shrimpl/build/outputs/apk/release/shrimpl-release.apk
          fi

      - name: Upload template and Shrimpl APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            template/build/outputs/apk/release/template-release.apk
            shrimpl/build/outputs/apk/debug/shrimpl-debug.apk
            shrimpl/build/outputs/apk/release/shrimpl-release.apk
          if-no-files-found: warn
          # Builds are tested from APKs sent directly, so CI copies only need to last a day.
          retention-days: 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            core/build/test-results/
            template/build/reports/
            template/build/test-results/
            shrimpl/build/reports/
          if-no-files-found: ignore
          retention-days: 1
