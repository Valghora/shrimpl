name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Resolve compileSdk
        id: sdk
        run: echo "api=$(grep -oE 'compileSdk[^0-9]*[0-9]+' app/build.gradle.kts 2>/dev/null | grep -oE '[0-9]+$' || echo 37)" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api${{ steps.sdk.outputs.api }}-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      - name: Verify (Phase 6)
        run: scripts/ci_verify.sh

      - name: Upload APKs
        if: success() && hashFiles('dist/*.apk') != ''
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always() && hashFiles('app/build/reports/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
