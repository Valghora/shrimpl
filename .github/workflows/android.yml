name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  sites:
    name: Validate sites and scripts
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate every site config
        run: python3 scripts/site_config.py validate --all

      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: List sites
        id: list
        run: echo "sites=$(python3 scripts/site_config.py list --json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.site }}
    needs: sites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.sites) }}
    env:
      HAS_SIDELOAD_KEY: ${{ secrets.SIDELOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Resolve compileSdk
        id: sdk
        run: echo "api=$(grep -oE '^COMPILE_SDK\s*=\s*[0-9]+' sites/defaults.toml | grep -oE '[0-9]+$' || echo 37)" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api${{ steps.sdk.outputs.api }}-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      - name: Sideload signing key
        if: env.HAS_SIDELOAD_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Verify (Phase 6)
        env:
          SITE: ${{ matrix.site }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: scripts/ci_verify.sh

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.site }}
          path: dist/*.apk

      - name: Upload reports
        if: always() && hashFiles('app/build/reports/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.site }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
