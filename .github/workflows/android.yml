name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  build:
    name: Core, template and Shrimpl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api37-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      # :core:check runs the core tests (including building real web apps from the template release
      # APK) and the 85% line-coverage rule.
      - name: Tests, lint and builds
        run: >-
          ./gradlew --console=plain :core:check :core:jacocoTestReport
          :template:testDebugUnitTest :template:lintRelease :template:assembleRelease
          :shrimpl:testDebugUnitTest :shrimpl:lintDebug :shrimpl:assembleDebug :shrimpl:assembleRelease

      # R0: no APK may need a translation layer on ARM or x86 devices. The template (and so every web
      # app built from it) has no native code; Shrimpl's third-party libraries must cover all four ABIs.
      - name: Architecture-neutral APKs
        run: |
          scripts/check_native_code.sh --none template/build/outputs/apk/release/template-release.apk
          scripts/check_native_code.sh --all-abis shrimpl/build/outputs/apk/debug/shrimpl-debug.apk shrimpl/build/outputs/apk/release/shrimpl-release.apk

      - name: Upload template and Shrimpl APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            template/build/outputs/apk/release/template-release.apk
            shrimpl/build/outputs/apk/debug/shrimpl-debug.apk
            shrimpl/build/outputs/apk/release/shrimpl-release.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            core/build/test-results/
            template/build/reports/
            template/build/test-results/
            shrimpl/build/reports/
          if-no-files-found: ignore
