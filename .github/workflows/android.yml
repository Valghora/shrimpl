name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  sites:
    name: Validate sites and scripts
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate every site config
        run: python3 scripts/site_config.py validate --all

      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: List sites
        id: list
        run: echo "sites=$(python3 scripts/site_config.py list --json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.site }}
    needs: sites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.sites) }}
    env:
      HAS_SIDELOAD_KEY: ${{ secrets.SIDELOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Default is read-only on non-default branches; write so feature-branch runs warm the cache too.
          cache-read-only: false

      - name: Resolve compileSdk
        id: sdk
        run: echo "api=$(grep -oE '^COMPILE_SDK\s*=\s*[0-9]+' sites/defaults.toml | grep -oE '[0-9]+$' || echo 37)" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api${{ steps.sdk.outputs.api }}-${{ hashFiles('scripts/setup_android_sdk.sh') }}

      - name: Set up Android SDK and check tools
        run: scripts/setup_android_sdk.sh

      - name: Sideload signing key
        if: env.HAS_SIDELOAD_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Verify (Phase 6)
        env:
          SITE: ${{ matrix.site }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: scripts/ci_verify.sh

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.site }}
          path: dist/*.apk

      - name: Upload reports
        if: always() && hashFiles('app/build/reports/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.site }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  smoke:
    name: Smoke test ${{ matrix.site }}
    needs: [sites, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.sites) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v8
        with:
          name: apks-${{ matrix.site }}
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android SDK with emulator
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-emulator-${{ runner.os }}-${{ hashFiles('scripts/setup_android_sdk.sh', 'sites/defaults.toml') }}

      - name: Set up Android SDK, emulator and system image
        env:
          WITH_EMULATOR: "1"
        run: scripts/setup_android_sdk.sh

      - name: Boot emulator
        timeout-minutes: 15
        run: |
          image="$(cat "$ANDROID_HOME/.wrapper-system-image")"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "$image" -d pixel_7 --force
          # The image asks for a 12 GB data partition; a hosted runner has about 8 GB free.
          sed -i '/^disk.dataPartition.size=/d' "$HOME/.android/avd/smoke.avd/config.ini"
          echo "disk.dataPartition.size=4G" >> "$HOME/.android/avd/smoke.avd/config.ini"
          mkdir -p "dist/smoke-${{ matrix.site }}"
          log="$PWD/dist/smoke-${{ matrix.site }}/emulator.log"
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 -partition-size 4096 > "$log" 2>&1 &
          emulator_pid=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          fail() { echo "::error::$1"; tail -n 80 "$log"; exit 1; }
          booted=0
          for _ in $(seq 1 120); do
            kill -0 "$emulator_pid" 2>/dev/null || fail "the emulator exited"
            [[ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && { booted=1; break; }
            sleep 5
          done
          [[ $booted == 1 ]] || fail "the emulator did not boot within 10 minutes"
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell input keyevent 82
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Smoke test
        timeout-minutes: 10
        run: scripts/smoke_test.sh "${{ matrix.site }}" "" "dist/smoke-${{ matrix.site }}"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.site }}
          path: dist/smoke-${{ matrix.site }}/
          if-no-files-found: ignore

      # The emulator runs in the background; left running, it stalls the runner's orphan-process cleanup.
      - name: Stop emulator
        if: always()
        run: |
          timeout 20 "$ANDROID_HOME/platform-tools/adb" emu kill || true
          sleep 5
          pkill -9 -f qemu-system || true
          pkill -9 -f "emulator/emulator" || true
          timeout 10 "$ANDROID_HOME/platform-tools/adb" kill-server || true
