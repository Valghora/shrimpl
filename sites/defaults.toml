# Defaults shared by every site. A site's sites/<id>/site.toml overrides any key here.
# Personal overrides (for example your own PACKAGE_PREFIX) go in sites/defaults.local.toml,
# which is gitignored and applied between this file and the site file.
# Keys and meanings: docs/SITE_CONFIG.md

# ---------- Identity ----------
PACKAGE_PREFIX = "com.valghora.pwa"
VERSION_CODE = "auto"          # "auto" = minutes since 2024-01-01 UTC, so every rebuild installs as an update
VERSION_NAME = "1.0.0"

# ---------- SDK (fixed by the template; the code assumes API 37 and has no SDK_INT guards) ----------
MIN_SDK = 37
TARGET_SDK = 37
COMPILE_SDK = 37

# ---------- Domains ----------
OAUTH_DOMAINS = [
  "accounts.google.com",
  "appleid.apple.com",
  "github.com",
  "login.microsoftonline.com",
  "login.live.com",
]

# ---------- User agent ----------
USER_AGENT_MODE = "auto"       # "auto" (by device class) | "desktop" | "mobile"
USER_AGENT_OVERRIDE = ""       # non-empty = used verbatim; disables the two features below
UA_STORE_REDIRECT_FALLBACK = true
UA_USER_TOGGLE = true

# ---------- Branding ----------
ICON_FOREGROUND_HEX = "auto"   # "auto" = white or black, whichever contrasts better with ICON_BACKGROUND_HEX
ICON_RASTER_MASKABLE = false
HEADER_SURFACE_HEX_NIGHT = ""  # empty = same as HEADER_SURFACE_HEX

# ---------- Capabilities ----------
ALLOW_MICROPHONE = false
ALLOW_CAMERA = false
ALLOW_NOTIFICATIONS = true
ALLOW_PROTECTED_MEDIA = false
ENABLE_MULTI_WINDOW = true
KEEP_ALIVE_WHEN_HIDDEN = true
PAUSE_ON_POWER_SAVE = false    # true = the page freezes whenever Battery Saver is on, even in the foreground
NATIVE_CONTEXT_MENU = true

# ---------- Build output ----------
RELEASE_SIGNING = "auto"       # "auto" = sideload key if configured, else the local debug key | "unsigned"

# ---------- Freeform window defaults (desktop windowing only) ----------
DEFAULT_WINDOW_DP = [1280, 800]
MIN_WINDOW_DP = [400, 500]

# ---------- Shortcuts (documentation only; they still reach the page) ----------
APP_SHORTCUTS = []
